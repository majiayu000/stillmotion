name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_ENGINE_STRICT: 'true'
    strategy:
      matrix:
        node: ['22.12.0', 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install encoder and probe
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Record the basic example and a silent page with installed Chrome
        run: node scripts/browser-smoke.mjs
